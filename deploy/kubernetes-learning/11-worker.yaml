apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipper-worker
  namespace: clipper
  labels:
    app.kubernetes.io/name: clipper-worker
    app.kubernetes.io/part-of: klipcut
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clipper-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clipper-worker
        app.kubernetes.io/part-of: klipcut
    spec:
      serviceAccountName: clipper-worker
      # worker.py handles SIGTERM by finishing the current job. This must be
      # longer than a normal render if graceful completion is expected.
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/YOUR_ORG/klipcut-backend@sha256:IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["worker.py"]
          envFrom:
            - configMapRef:
                name: clipper-config
            - secretRef:
                name: clipper-secrets
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 6Gi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media-scratch
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media-scratch
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi


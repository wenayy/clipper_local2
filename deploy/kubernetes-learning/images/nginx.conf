server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite assets have content hashes and can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React owns client-side routes such as /share/...; return the app shell
    # when a matching static file does not exist.
    location / {
        try_files $uri $uri/ /index.html;
    }
}


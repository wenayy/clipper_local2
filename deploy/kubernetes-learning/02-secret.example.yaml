# SAFE TEMPLATE ONLY. Do not put real values in Git.
# Kubernetes Secret values are not magically encrypted merely because the
# object is named Secret. Prefer External Secrets / a cloud secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: clipper-secrets
  namespace: clipper
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@POSTGRES_HOST:5432/clipper?sslmode=require"
  CLIPPER_SECRET_KEY: "REPLACE_WITH_A_LONG_RANDOM_VALUE"
  R2_ACCESS_KEY_ID: "REPLACE_ME"
  R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  DEEPGRAM_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  YOUTUBE_API_KEY: "REPLACE_ME_IF_USED"
  POLAR_ACCESS_TOKEN: "REPLACE_ME"
  POLAR_WEBHOOK_SECRET: "REPLACE_ME"


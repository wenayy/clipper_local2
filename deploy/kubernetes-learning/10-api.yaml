apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipper-api
  namespace: clipper
  labels:
    app.kubernetes.io/name: clipper-api
    app.kubernetes.io/part-of: klipcut
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clipper-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clipper-api
        app.kubernetes.io/part-of: klipcut
    spec:
      serviceAccountName: clipper-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/klipcut-backend@sha256:IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["server:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clipper-config
            - secretRef:
                name: clipper-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          # /api/health queries PostgreSQL. It is usable as an initial
          # readiness check, but section 8.5 of the scaling guide explains why
          # a dedicated /readyz returning non-2xx is the desired endpoint.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media-scratch
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media-scratch
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clipper-api
  namespace: clipper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clipper-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP


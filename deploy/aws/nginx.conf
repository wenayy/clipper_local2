# Single-origin front door for the one-box deploy: serve the React build and
# reverse-proxy /api to the backend container, so the whole app is one origin.
#
# Listens on both 8080 (published :80) and 8443 TLS (published :443). Serving
# real HTTPS lets Cloudflare stay on Full (strict) for the whole zone, so a
# single global SSL mode does not have to be downgraded to Flexible for this one
# origin -- which would break every other project on the same domain. The cert is
# a Cloudflare Origin Certificate mounted at /etc/nginx/certs (see deploy README).
server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Source uploads are videos. nginx caps bodies at 1 MB by default, which
    # would reject every upload; lift it. (Cloudflare's free plan still caps the
    # proxied request body at 100 MB -- larger sources must come in by URL.)
    client_max_body_size 2g;

    # Hashed Vite assets are immutable and safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything under /api is the FastAPI backend (mounted at /api in server.py).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Renders and uploads are slow; don't cut them off at nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # stream large uploads instead of buffering
    }

    # React owns client-side routes (e.g. /share/...); serve the shell for any
    # path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
